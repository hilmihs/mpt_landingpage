[project]
name = "muhajir-tilawah-ml"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "huggingface-hub>=0.22",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Pengubah teks Uthmani → skrip fonetik + sifat, dari penulis model.
    # Bukan kemewahan: tanpa ini target harus ditebak, dan tebakan sebelumnya
    # meleset total (lihat catatan di app/ml/alfatihah.py).
    "quran-transcript>=0.5",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
