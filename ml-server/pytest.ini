[pytest]
# Tanpa baris ini, setiap tes `async def` di test_audio.py GAGAL dengan
# "async def functions are not natively supported" — bukan karena kodenya salah,
# melainkan karena pytest tidak tahu harus menjalankannya lewat asyncio.
# pytest-asyncio sudah terdaftar di optional-dependencies dev, cuma belum pernah
# dinyalakan.
asyncio_mode = auto
testpaths = tests
